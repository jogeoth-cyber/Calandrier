name: Mettre à jour le calendrier Rugby

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le script Python
        run: python script.py

      - name: Publier les modifications sur le dépôt
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add calendrier_ubb_xv_france.ics
          git commit -m "Mise à jour automatique du calendrier rugby [skip ci]" || echo "Aucun changement à commiter"
          git push
